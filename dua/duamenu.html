<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dua Menu</title>
<style>
  body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background-color: #003d32;
  color: #fff;
}

.header {
  text-align: center;
  padding: 2rem 1rem;
  background-color: #003428;
  color: #fdd76e;
}

.header h1 {
  font-size: 2.5rem;
  margin-bottom: 0.5rem;
}

.subtitle {
  font-size: 1.2rem;
  color: #eee;
}

.menu {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 2rem;
  padding: 3rem 1rem;
  background-color: #f2f2f2;
}

.card {
  background: #ffffff;
  width: 180px;
  height: 200px;
  border-radius: 20px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #003d32;
  text-decoration: none;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  cursor: pointer;
}

.card img {
  width: 80px;
  height: 80px;
  margin-bottom: 1rem;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 24px rgba(0,0,0,0.2);
}

</style>

</head>
<body>
  <header class="header">
    <h1>Dua Menu</h1>
    <p class="subtitle">Select a category below</p>
  </header>

  <section class="menu">
    <div class="card" onclick="alert('Currently not available')">
      <img src="./dua.png" alt="Common Dua" />
      <p>Common Dua</p>
    </div>
    <a class="card" href="./quranic-dua.html">
      <img src="./image.png" alt="Quranic Dua" />
      <p>Quranic Dua</p>
    </a>
  </section>
</body>
</html>
